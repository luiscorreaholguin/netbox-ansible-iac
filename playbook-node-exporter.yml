---
- name: Instalar y configurar Node Exporter en servidores de NetBox
  hosts: all
  become: true
  vars:
    node_exporter_version: "1.8.2"
    node_exporter_user: "node_exporter"

  tasks:
    - name: Crear usuario del sistema para node_exporter
      ansible.builtin.user:
        name: "{{ node_exporter_user }}"
        system: true
        shell: /bin/false

    - name: Descargar Node Exporter
      ansible.builtin.get_url:
        url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
        dest: "/tmp/node_exporter.tar.gz"

    - name: Extraer Node Exporter
      ansible.builtin.unarchive:
        src: "/tmp/node_exporter.tar.gz"
        dest: "/tmp/"
        remote_src: true

    - name: Copiar binario a /usr/local/bin
      ansible.builtin.copy:
        src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"
        dest: "/usr/local/bin/node_exporter"
        owner: "{{ node_exporter_user }}"
        group: "{{ node_exporter_user }}"
        mode: '0755'
        remote_src: true

    - name: Crear servicio systemd para Node Exporter
      ansible.builtin.copy:
        dest: /etc/systemd/system/node_exporter.service
        content: |
          [Unit]
          Description=Prometheus Node Exporter
          After=network.target

          [Service]
          User={{ node_exporter_user }}
          ExecStart=/usr/local/bin/node_exporter

          [Install]
          WantedBy=multi-user.target
      notify: Recargar systemd y arrancar Node Exporter

  handlers:
    - name: Recargar systemd y arrancar Node Exporter
      ansible.builtin.systemd:
        name: node_exporter
        daemon_reload: true
        state: started
        enabled: true
